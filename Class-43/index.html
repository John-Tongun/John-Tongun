<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <main>
            <h1>JavaScript Data Types</h1>
            <main>
             <script>
                
                var name;
                 console.log(name); 
                 console.log("The Variable 'name' Data type is;" + typeof(name));
                 
                 var a;  // undefined (automatically assigned)
                 var b = null; // null (intentional)

                 /*
                     undefined      => JavaScript didn't assign any value a value 
                     null           => You intentionally set "no value"
                  */
                 
                    console.log(a); // ?
                    console.log("The Variable 'a' Data type is;" + typeof(a));

                    console.log(b); // ?
                    console.log("The Variable 'b' Data type is;" + typeof(b));

                    /*
                       Real-world analogy
                       undefined   => You ordered food , but it hasn't arrived yet.
                       null        =  you decided not to order anything.
                       
                        */

                        /*
                            undefined isn't an error. It's just Javascript telling 
                            you "there's nothing here yet."
                        */
                      
                        console.log(b); // ?
                        console.log("The Variable 'c' Data type is;" + typeof(c));
                                </script>
                            </main>
                        </main>
                    </body>
                </html>
